[package]
name = "jev-sample"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ts-rs = "12.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
dotenvy = "0.15.7"
subtle = "2.6.1"
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-stdout = { version = "0.33.0", default-features = false, features = ["trace"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "testing"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
tokio = { version = "1.53.2", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
