<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipClaim | File fast. Settle faster.</title>
    <meta name="description" content="ZipClaim: AI-native insurance support. Plan the work, follow decisions, and stay in control. Synthetic preview." />
    <link rel="icon" type="image/png" href="/zipclaim-icon.png" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
